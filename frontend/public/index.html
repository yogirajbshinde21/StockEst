<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="StockEst - Stock Market Simulator for Rural Education. Learn stock trading with virtual money and real market data." />
    <meta name="keywords" content="stock market, trading simulator, education, rural learning, virtual trading, stock market education" />
    <meta name="author" content="StockEst Platform" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stockest.com/" />
    <meta property="og:title" content="StockEst - Stock Market Simulator for Rural Education" />
    <meta property="og:description" content="Learn stock trading with virtual money and real market data. Perfect for rural education and beginner investors." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://stockest.com/" />
    <meta property="twitter:title" content="StockEst - Stock Market Simulator for Rural Education" />
    <meta property="twitter:description" content="Learn stock trading with virtual money and real market data. Perfect for rural education and beginner investors." />
    <meta property="twitter:image" content="%PUBLIC_URL%/twitter-image.png" />

    <!-- Preconnect to external domains for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Google Fonts - Optimized for rural connectivity -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Favicon and app icons -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Prevent zoom on mobile for better UX -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- iOS specific meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StockEst" />
    
    <!-- Microsoft specific meta tags -->
    <meta name="msapplication-TileColor" content="#667eea" />
    <meta name="msapplication-config" content="%PUBLIC_URL%/browserconfig.xml" />
    
    <title>StockEst - Stock Market Simulator for Rural Education</title>
    
    <style>
      /* Critical CSS for initial page load */
      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
        color: #1a1a1a;
      }
      
      /* Loading screen styles */
      .initial-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        gap: 1rem;
      }
      
      .loading-logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 1rem;
        animation: pulse 2s infinite;
      }
      
      .loading-text {
        color: #6b7280;
        font-size: 1.1rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }
      
      .loading-subtitle {
        color: #9ca3af;
        font-size: 0.9rem;
        text-align: center;
        max-width: 300px;
      }
      
      .loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-top: 1rem;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      
      /* Hide loading screen when React app loads */
      .initial-loading.loaded {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease-out;
      }
      
      /* Optimize for slow connections */
      @media (prefers-reduced-motion: reduce) {
        .loading-logo,
        .loading-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 2rem; background: #fef2f2; color: #991b1b; border-radius: 8px; margin: 2rem;">
        <h2>JavaScript Required</h2>
        <p>StockEst requires JavaScript to run. Please enable JavaScript in your browser settings and reload the page.</p>
        <p>स्टॉकएस्ट चलाने के लिए JavaScript की आवश्यकता है। कृपया अपने ब्राउज़र सेटिंग्स में JavaScript सक्षम करें और पृष्ठ को पुनः लोड करें।</p>
      </div>
    </noscript>
    
    <!-- Initial loading screen -->
    <div id="initial-loading" class="initial-loading">
      <div class="loading-logo">SE</div>
      <div class="loading-text">StockEst</div>
      <div class="loading-subtitle">Stock Market Simulator for Rural Education</div>
      <div class="loading-spinner"></div>
    </div>
    
    <!-- React app will mount here -->
    <div id="root"></div>
    
    <!-- Performance and analytics scripts would go here -->
    <script>
      // Hide loading screen when React app loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('initial-loading');
          if (loadingScreen) {
            loadingScreen.classList.add('loaded');
            setTimeout(function() {
              loadingScreen.remove();
            }, 500);
          }
        }, 1000);
      });
      
      // Simple error handling for critical errors
      window.addEventListener('error', function(e) {
        console.error('Critical error:', e.error);
        // Could send error to logging service
      });
      
      // Service Worker registration for offline functionality (future enhancement)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('SW registered: ', registration);
            })
            .catch(function(registrationError) {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
